# Demonstração pública na VPS: MongoDB (replica set de 1 nó) + API, com recursos limitados porque a VPS é
# compartilhada. Nenhuma porta é publicada no host: a API entra na rede do Caddy que já atende 80/443
# (rede externa "deploy_default") com o nome vinculos-api. Passo a passo no README, seção "Deploy na VPS".
name: vinculos

services:
  mongo:
    image: mongo:8.0
    command: ["--replSet", "rs0", "--bind_ip_all", "--wiredTigerCacheSizeGB", "1.5"]
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    deploy:
      resources:
        limits: { cpus: "2", memory: 3g }
    # Só fica "healthy" como PRIMARY; na primeira subida inicia o replica set.
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval",
             "try { if (rs.status().myState !== 1) quit(1) } catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'mongo:27017'}]}); quit(1) }"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 10s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  api:
    build: ..
    image: vinculos-api:latest
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    # Credenciais do Elastic Observability (OTEL_EXPORTER_OTLP_ENDPOINT e OTEL_EXPORTER_OTLP_HEADERS) ficam
    # em deploy/.env, só na VPS e fora do Git. Sem esse arquivo, a API roda sem o agente OpenTelemetry.
    env_file:
      - path: .env
        required: false
    environment:
      MONGODB_URI: mongodb://mongo:27017/vinculos?directConnection=true&maxPoolSize=50&minPoolSize=5&waitQueueTimeoutMS=2000&retryWrites=true
      ACTUATOR_ENDPOINTS: health      # em público, só o health check (sem metrics/caches)
      JAVA_OPTS: -XX:MaxRAMPercentage=70
      CACHE_SPEC: maximumSize=50000,expireAfterWrite=5m,recordStats   # cabe no heap de ~700 MB do container
      OTEL_SERVICE_NAME: vinculos-api
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment.name=vps-demo,service.version=1.0.0
      OTEL_METRIC_EXPORT_INTERVAL: "15000"
    deploy:
      resources:
        limits: { cpus: "2", memory: 1g }
    networks:
      default: {}
      edge:
        aliases: [vinculos-api]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

networks:
  edge:
    name: deploy_default
    external: true

volumes:
  mongo-data:
