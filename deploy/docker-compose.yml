# Demonstração pública na VPS: MongoDB em replica set de 3 nós + API, com recursos limitados porque a VPS é
# compartilhada. Nenhuma porta é publicada no host: a API entra na rede do Caddy que já atende 80/443
# (rede externa "deploy_default") com o nome vinculos-api. Passo a passo no README, seção "Deploy".
#
# Se o primário cair, os outros dois elegem um novo em segundos, e a API continua lendo de um secundário
# (primaryPreferred + read concern majority) durante a eleição. O nó "mongo" tem prioridade e mais cache.
name: vinculos

x-mongo: &mongo
  image: mongo:8.0
  restart: unless-stopped
  # Saudável como PRIMARY ou SECONDARY (depois de uma falha, o nó 1 pode voltar como secundário).
  healthcheck:
    test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.hello().isWritablePrimary || db.hello().secondary ? 0 : 1)"]
    interval: 5s
    timeout: 10s
    retries: 30
    start_period: 10s
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  mongo:
    <<: *mongo
    command: ["--replSet", "rs0", "--bind_ip_all", "--wiredTigerCacheSizeGB", "1.5"]
    volumes:
      - mongo-data:/data/db
    deploy:
      resources:
        limits: { cpus: "2", memory: 2560m }

  mongo2:
    <<: *mongo
    command: ["--replSet", "rs0", "--bind_ip_all", "--wiredTigerCacheSizeGB", "0.5"]
    volumes:
      - mongo2-data:/data/db
    deploy:
      resources:
        limits: { cpus: "1", memory: 1536m }

  mongo3:
    <<: *mongo
    command: ["--replSet", "rs0", "--bind_ip_all", "--wiredTigerCacheSizeGB", "0.5"]
    volumes:
      - mongo3-data:/data/db
    deploy:
      resources:
        limits: { cpus: "1", memory: 1536m }

  # Inicia o replica set ou acrescenta os membros que faltam (idempotente).
  mongo-init:
    image: mongo:8.0
    restart: "no"
    depends_on:
      mongo: { condition: service_started }
      mongo2: { condition: service_started }
      mongo3: { condition: service_started }
    volumes:
      - ./mongo-init.js:/mongo-init.js:ro
    command: ["mongosh", "--host", "mongo", "--quiet", "/mongo-init.js"]

  api:
    build: ..
    image: vinculos-api:latest
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    # Credenciais do Elastic Observability (OTEL_EXPORTER_OTLP_ENDPOINT e OTEL_EXPORTER_OTLP_HEADERS) ficam
    # em deploy/.env, só na VPS e fora do Git. Sem esse arquivo, a API roda sem o agente OpenTelemetry.
    env_file:
      - path: .env
        required: false
    environment:
      MONGODB_URI: mongodb://mongo:27017,mongo2:27017,mongo3:27017/vinculos?replicaSet=rs0&maxPoolSize=50&minPoolSize=5&waitQueueTimeoutMS=2000&serverSelectionTimeoutMS=5000&retryWrites=true
      ACTUATOR_ENDPOINTS: health      # em público, só o health check (sem metrics/caches)
      JAVA_OPTS: -XX:MaxRAMPercentage=70
      CACHE_SPEC: maximumSize=50000,expireAfterWrite=5m,recordStats   # cabe no heap de ~700 MB do container
      OTEL_SERVICE_NAME: vinculos-api
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment.name=vps-demo,service.version=1.0.0
      OTEL_METRIC_EXPORT_INTERVAL: "15000"
      OTEL_INSTRUMENTATION_MICROMETER_ENABLED: "true"   # métricas do Spring (cache.gets, pool do Mongo) também vão ao Elastic
    deploy:
      resources:
        limits: { cpus: "2", memory: 1g }
    networks:
      default: {}
      edge:
        aliases: [vinculos-api]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

networks:
  edge:
    name: deploy_default
    external: true

volumes:
  mongo-data:
  mongo2-data:
  mongo3-data:
