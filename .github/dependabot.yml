# Atualizações de dependências e alertas de vulnerabilidade (Maven, imagens do Dockerfile e actions da CI).
# Os PRs passam pela CI (testes + portão de cobertura) antes de qualquer merge.
version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      spring:
        patterns: ["org.springframework*", "org.springdoc*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
