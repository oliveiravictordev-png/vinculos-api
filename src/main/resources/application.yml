spring:
  application:
    name: vinculos-api
  threads:
    virtual:
      enabled: true          # requisições em virtual threads: I/O bloqueante no Mongo sem esgotar threads do Tomcat
  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27017/vinculos?directConnection=true&maxPoolSize=200&minPoolSize=20&waitQueueTimeoutMS=2000&serverSelectionTimeoutMS=5000&retryWrites=true}
  cache:
    type: caffeine
    cache-names: companies,records
    caffeine:
      spec: ${CACHE_SPEC:maximumSize=200000,expireAfterWrite=5m,recordStats}
  mvc:
    problemdetails:
      enabled: true

server:
  shutdown: graceful
  forward-headers-strategy: native   # IP do cliente via X-Forwarded-For do proxy reverso (Caddy), só de proxies internos

app:
  auth:
    admin-1-username: ${AUTH_ADMIN1_USERNAME:}
    admin-1-password: ${AUTH_ADMIN1_PASSWORD:}
    admin-2-username: ${AUTH_ADMIN2_USERNAME:}
    admin-2-password: ${AUTH_ADMIN2_PASSWORD:}
    jwt-private-key: ${JWT_PRIVATE_KEY:}            # RSA PKCS#8 (Base64 ou PEM): make jwt-key
    jwt-previous-public-key: ${JWT_PREVIOUS_PUBLIC_KEY:}  # só durante uma rotação de chave
    issuer: ${JWT_ISSUER:vinculos-api}
    ttl: ${JWT_TTL:PT15M}
    refresh-ttl: ${JWT_REFRESH_TTL:PT12H}   # duração máxima da sessão do navegador
  audit:
    hash-secret: ${AUDIT_HASH_SECRET:}
    retention: ${AUDIT_RETENTION:P90D}
  monitor:
    interval: PT1M           # janela dos alertas: compara cada minuto com o anterior
    status-thresholds:       # respostas por minuto, por instância, que disparam alerta
      401: 30
      429: 50
      500: 5
      503: 5
    max-slow-queries: 10     # consultas ao MongoDB acima de app.query.slow-ms por minuto
    min-cache-requests: 100  # abaixo disso a taxa de acerto do minuto não é significativa
    cache-hit-drop: 0.3      # queda (em pontos de 0 a 1) da taxa de acerto em relação à média recente
  query:
    timeout-ms: 2000         # maxTimeMS no servidor: consulta lenta é abortada em vez de acumular
    slow-ms: 200             # acima disso a consulta é logada em WARN
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    per-ip-capacity: 40      # rajada por IP
    per-ip-per-second: 20    # ritmo sustentado por IP
    global-capacity: 600     # rajada da instância inteira
    global-per-second: 300   # ritmo sustentado da instância
    export-capacity: 3       # exportações em rajada por IP
    export-per-minute: 6     # exportações sustentadas por IP

seed:
  total-records: 1000000000
  start-customer: 0          # para retomar uma carga a partir de um cliente
  batch-size: 10000          # documentos por insertMany
  workers: 0                 # 0 = número de CPUs

management:
  endpoints:
    web:
      exposure:
        include: ${ACTUATOR_ENDPOINTS:health,metrics,caches}
  endpoint:
    health:
      probes:
        enabled: true        # /actuator/health/liveness e /actuator/health/readiness
      group:
        readiness:
          include: readinessState,mongo   # só fica pronta quando o MongoDB responde

springdoc:
  show-actuator: true        # o health check aparece no Swagger
  api-docs:
    enabled: true            # documentação pública é intencional (explícito evita o WARN do springdoc a cada subida)
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operations-sorter: method
